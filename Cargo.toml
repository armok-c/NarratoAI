[package]
name = "narratoai-core"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.52.1", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ffmpeg-sidecar = { version = "2.5.1", features = ["download_ffmpeg"] }
notify = "9.0.0-rc.3"  # 已知风险: RC 版 API 不稳定，9.0.0 正式版可能破坏兼容性
serde_json = "1.0.140"
async-trait = "0.1.89"
tokio-tungstenite = { version = "0.29.0", features = ["native-tls"] }
native-tls = "0.2"
uuid = { version = "1.23.1", features = ["v4"] }
async-openai = { version = "0.36", features = ["chat-completion"] }
image = "0.25"
base64 = "0.22"
futures = "0.3"
reqwest = "0.13"
serde_repr = "0.1.20"

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6"
