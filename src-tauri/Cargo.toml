[package]
name = "narratoai-app"
version = "0.1.0"
edition = "2021"

[lib]
name = "narratoai_app"
path = "src/lib.rs"

[[bin]]
name = "narratoai"
path = "src/main.rs"

[dependencies]
narratoai-core = { path = "../narratoai-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
ts-rs = { version = "11", features = ["serde-compat", "format"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
